<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脉动资讯 PulseNews - 7×24小时全球实时新闻门户</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts: Noto Sans SC & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- 配置 Tailwind 自定义主题与暗黑模式 -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '"Noto Sans SC"', 'system-ui', '-apple-system', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* 自定义滚动条样式 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.7);
        }

        /* 突发新闻无缝横向滚动动画 */
        @keyframes tickerScroll {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }
        .animate-ticker {
            display: flex;
            width: max-content;
            animation: tickerScroll 35s linear infinite;
        }
        .animate-ticker:hover {
            animation-play-state: paused;
        }

        /* 新消息滑入动画 */
        @keyframes slideDownFade {
            0% {
                opacity: 0;
                transform: translateY(-16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-slide-in {
            animation: slideDownFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* 隐藏横向导航滚动条但保留滚动功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200 antialiased selection:bg-brand-500 selection:text-white">

    <!-- ==================== 1. 顶部导航栏 ==================== -->
    <header class="sticky top-0 z-40 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <!-- 上半部分：Logo、实时时钟、搜索框、操作按钮 -->
            <div class="flex items-center justify-between h-16 gap-3">
                <!-- 品牌 Logo 与 实时时钟 -->
                <div class="flex items-center gap-4 shrink-0">
                    <a href="#" onclick="resetFilters(event)" class="flex items-center gap-2.5 group">
                        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-brand-600 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-brand-500/20 group-hover:scale-105 transition-transform">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                            </svg>
                        </div>
                        <div>
                            <div class="flex items-center gap-1.5">
                                <span class="text-xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-slate-900 to-slate-700 dark:from-white dark:to-slate-300">脉动资讯</span>
                                <span class="inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold bg-red-500/10 text-red-600 dark:bg-red-500/20 dark:text-red-400 border border-red-500/20">LIVE</span>
                            </div>
                        </div>
                    </a>

                    <!-- 实时时钟（桌面端显示） -->
                    <div class="hidden lg:flex items-center gap-2 pl-4 border-l border-slate-200 dark:border-slate-700 text-xs text-slate-500 dark:text-slate-400 font-mono">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="live-clock">加载时间中...</span>
                    </div>
                </div>

                <!-- 右侧功能区：搜索框 + 模拟推送按钮 + 深浅色切换 -->
                <div class="flex items-center gap-2 sm:gap-3 flex-1 justify-end max-w-xl">
                    <!-- 实时搜索框 -->
                    <div class="relative flex-1 max-w-xs">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                        </div>
                        <input 
                            type="text" 
                            id="search-input" 
                            placeholder="搜索新闻标题、关键词..." 
                            class="block w-full pl-9 pr-8 py-1.5 sm:py-2 text-sm rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-100/70 dark:bg-slate-800/80 text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white dark:focus:bg-slate-800 transition-all"
                        >
                        <button 
                            id="clear-search-btn" 
                            onclick="clearSearch()" 
                            class="hidden absolute inset-y-0 right-0 pr-2.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                            title="清空搜索"
                        >
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>

                    <!-- 手动模拟推送按钮 -->
                    <button 
                        onclick="triggerManualPush()" 
                        class="inline-flex items-center gap-1.5 px-3 py-1.5 sm:py-2 rounded-xl text-xs sm:text-sm font-medium bg-brand-600 hover:bg-brand-700 active:scale-95 text-white shadow-sm shadow-brand-500/20 transition-all shrink-0 cursor-pointer"
                        title="立即模拟接收一条最新突发快讯"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                        </svg>
                        <span class="hidden sm:inline">模拟接收最新快讯</span>
                        <span class="sm:hidden">模拟快讯</span>
                    </button>

                    <!-- 深色/浅色模式切换按钮 -->
                    <button 
                        id="theme-toggle" 
                        onclick="toggleTheme()" 
                        class="p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors shrink-0 cursor-pointer"
                        aria-label="切换深色/浅色模式"
                        title="切换深色/浅色主题"
                    >
                        <!-- 太阳图标 (暗黑模式下显示) -->
                        <svg id="sun-icon" class="hidden w-5 h-5 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                        <!-- 月亮图标 (浅色模式下显示) -->
                        <svg id="moon-icon" class="w-5 h-5 text-slate-700" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- 下半部分：分类导航标签栏 -->
            <nav class="flex items-center justify-between py-2.5 border-t border-slate-100 dark:border-slate-800/80 overflow-x-auto no-scrollbar gap-4">
                <div id="category-tabs" class="flex items-center gap-1.5 sm:gap-2">
                    <!-- 分类按钮由 JS 动态渲染 -->
                </div>
                <!-- 自动推送状态指示器 -->
                <div class="hidden md:flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400 shrink-0">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-brand-500"></span>
                    </span>
                    <span>自动实时监听中 · 每18秒检测更新</span>
                </div>
            </nav>
        </div>
    </header>

    <!-- ==================== 2. 突发新闻滚动播报条 (Breaking News Ticker) ==================== -->
    <div class="bg-slate-900 dark:bg-slate-900/95 text-white border-b border-slate-800 overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center h-10">
            <!-- 左侧固定标签 -->
            <div class="flex items-center gap-1.5 bg-red-600 text-white text-xs font-bold px-2.5 py-1 rounded-md shrink-0 mr-3 shadow-sm">
                <span class="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span>
                <span>突发快讯</span>
            </div>
            <!-- 滚动内容容器 -->
            <div class="relative flex-1 overflow-hidden h-full flex items-center">
                <div id="breaking-ticker-track" class="animate-ticker flex items-center gap-8 text-xs sm:text-sm text-slate-200">
                    <!-- 滚动播报条内容由 JS 动态渲染 -->
                </div>
            </div>
        </div>
    </div>

    <!-- ==================== 3. 主体双栏内容区 ==================== -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">
            
            <!-- 左侧栏：主新闻信息流 (占 8 列) -->
            <section class="lg:col-span-8 space-y-5">
                
                <!-- 实时动态推送提示横幅 (默认隐藏，有未读推送时滑出显示) -->
                <div id="new-push-banner" class="hidden animate-slide-in">
                    <button 
                        onclick="loadPendingNews()" 
                        class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-700 hover:to-indigo-700 text-white font-medium text-sm shadow-lg shadow-brand-500/25 flex items-center justify-center gap-2.5 transition-all cursor-pointer group"
                    >
                        <span class="relative flex h-2.5 w-2.5">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-300 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-400"></span>
                        </span>
                        <span id="new-push-text">有 1 条最新实时新闻推送，点击立即加载查看</span>
                        <svg class="w-4 h-4 group-hover:translate-y-0.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                    </button>
                </div>

                <!-- 当前筛选状态提示栏 -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <h2 id="feed-section-title" class="text-lg sm:text-xl font-bold tracking-tight text-slate-900 dark:text-white">
                            全部头条与深度报道
                        </h2>
                        <span id="news-count-badge" class="px-2 py-0.5 text-xs font-medium rounded-full bg-slate-200/80 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                            0 篇
                        </span>
                    </div>
                    <span class="text-xs text-slate-400 dark:text-slate-500">点击任意卡片阅读全文</span>
                </div>

                <!-- 头条大图卡片容器 -->
                <div id="hero-news-container"></div>

                <!-- 普通新闻列表卡片容器 -->
                <div id="news-list-container" class="space-y-4"></div>

                <!-- 无搜索结果空状态提示 -->
                <div id="empty-state" class="hidden py-16 px-4 text-center bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800">
                    <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                    </div>
                    <h3 class="text-base font-bold text-slate-800 dark:text-slate-200 mb-1">未找到匹配的新闻内容</h3>
                    <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">请尝试更换其他关键词，或切换回“全部分类”查看最新资讯。</p>
                    <button onclick="resetFilters()" class="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium transition-colors cursor-pointer">
                        重置筛选条件
                    </button>
                </div>
            </section>

            <!-- 右侧栏：7×24小时实时快讯时间线 + 热门话题排行榜 (占 4 列) -->
            <aside class="lg:col-span-4 space-y-6 lg:sticky lg:top-32">
                
                <!-- 模块 A：7×24小时实时快讯时间线 -->
                <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-hidden">
                    <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between bg-slate-50/50 dark:bg-slate-800/40">
                        <div class="flex items-center gap-2">
                            <span class="relative flex h-2.5 w-2.5">
                                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                                <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span>
                            </span>
                            <h3 class="font-bold text-base text-slate-900 dark:text-white">7×24小时实时快讯</h3>
                        </div>
                        <span class="text-[11px] font-medium px-2 py-0.5 rounded bg-brand-50 dark:bg-brand-900/30 text-brand-600 dark:text-brand-400">
                            电报直播
                        </span>
                    </div>

                    <!-- 时间线列表容器 -->
                    <div id="timeline-container" class="p-5 max-h-[430px] overflow-y-auto space-y-5">
                        <!-- 时间线节点由 JS 动态渲染 -->
                    </div>
                </div>

                <!-- 模块 B：热门话题排行榜 -->
                <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-hidden">
                    <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between bg-slate-50/50 dark:bg-slate-800/40">
                        <div class="flex items-center gap-2">
                            <svg class="w-5 h-5 text-orange-500" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.365 31.365 0 00-.613 3.58 2.64 2.64 0 01-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 005.05 6.05 6.981 6.981 0 003 11a7 7 0 1011.95-4.95c-.592-.591-.98-.985-1.348-1.467-.363-.476-.724-1.063-1.207-2.03zM12.12 15.12A3 3 0 017 13s.879.5 2.5.5c0-1 .5-4 1.25-4.5.5 1 .786 1.293 1.371 1.879A2.99 2.99 0 0113 13a2.99 2.99 0 01-.879 2.121z" clip-rule="evenodd" />
                            </svg>
                            <h3 class="font-bold text-base text-slate-900 dark:text-white">全网热搜话题榜</h3>
                        </div>
                        <span class="text-xs text-slate-400">实时热度</span>
                    </div>

                    <div id="trending-topics-container" class="p-4 divide-y divide-slate-100 dark:divide-slate-800/80">
                        <!-- 热门话题由 JS 动态渲染 -->
                    </div>
                </div>

            </aside>
        </div>
    </main>

    <!-- ==================== 4. 页脚 ==================== -->
    <footer class="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 mt-12 py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500 dark:text-slate-400">
            <div class="flex items-center gap-2">
                <span class="font-bold text-slate-700 dark:text-slate-200">脉动资讯 PulseNews</span>
                <span>·</span>
                <span>7×24小时全球实时新闻聚合平台</span>
            </div>
            <div>
                <span>© 2026 PulseNews 实时资讯中心 · 仅供前端交互与实时新闻展示演示</span>
            </div>
        </div>
    </footer>

    <!-- ==================== 5. 新闻正文详情模态框 (Modal) ==================== -->
    <div id="news-modal" class="fixed inset-0 z-50 hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <!-- 半透明背景遮罩 -->
        <div onclick="closeModal()" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm transition-opacity"></div>

        <!-- 模态框内容卡片 -->
        <div class="flex min-h-full items-center justify-center p-4 sm:p-6">
            <div class="relative w-full max-w-3xl bg-white dark:bg-slate-900 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden transform transition-all animate-slide-in">
                
                <!-- 顶部关闭操作栏 -->
                <div class="sticky top-0 z-10 flex items-center justify-between px-6 py-4 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-b border-slate-100 dark:border-slate-800">
                    <div class="flex items-center gap-2.5">
                        <span id="modal-category" class="px-2.5 py-0.5 rounded-md text-xs font-semibold bg-brand-50 text-brand-600 dark:bg-brand-900/40 dark:text-brand-400">
                            科技
                        </span>
                        <span id="modal-source" class="text-xs font-medium text-slate-500 dark:text-slate-400">
                            来源：脉动通讯社
                        </span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button 
                            onclick="copyArticleLink()" 
                            class="inline-flex items-center gap-1 px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition-colors cursor-pointer"
                            title="复制新闻摘要与链接"
                        >
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                            </svg>
                            <span id="copy-btn-text">分享摘要</span>
                        </button>
                        <button 
                            onclick="closeModal()" 
                            class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer"
                            aria-label="关闭窗口"
                        >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- 模态框滚动正文区 -->
                <div class="p-6 sm:p-8 max-h-[80vh] overflow-y-auto space-y-6">
                    <!-- 标题与发布信息 -->
                    <div class="space-y-3">
                        <h1 id="modal-title" class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white leading-snug">
                            新闻标题占位
                        </h1>

            { rank: 6, title: '40余国签署海洋碳汇联合声明', heat: '195.3万', tag: '', tagColor: '' },
            { rank: 7, title: '端侧手机流畅运行百亿大模型', heat: '168.7万', tag: '新', tagColor: 'bg-brand-500 text-white' }
        ];

        // -------------------- 2. 实时时钟更新 --------------------
        function updateLiveClock() {
            const now = new Date();
            const options = {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                weekday: 'short',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            const formatted = now.toLocaleString('zh-CN', options).replace(/\//g, '-');
            document.getElementById('live-clock').textContent = formatted;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        // -------------------- 3. 深色 / 浅色模式切换 --------------------
        function initTheme() {
            const savedTheme = localStorage.getItem('pulsenews-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                document.documentElement.classList.add('dark');
                updateThemeIcons(true);
            } else {
                document.documentElement.classList.remove('dark');
                updateThemeIcons(false);
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('pulsenews-theme', isDark ? 'dark' : 'light');
            updateThemeIcons(isDark);
            showToast(isDark ? '已切换至深色护眼模式' : '已切换至浅色明亮模式');
        }

        function updateThemeIcons(isDark) {
            const sunIcon = document.getElementById('sun-icon');
            const moonIcon = document.getElementById('moon-icon');
            if (isDark) {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            } else {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
        }

        // -------------------- 4. 渲染分类导航栏 --------------------
        function renderCategoryTabs() {
            const container = document.getElementById('category-tabs');
            container.innerHTML = CATEGORIES.map(cat => {
                const isActive = cat === currentCategory;
                const activeClasses = isActive
                    ? 'bg-brand-600 text-white shadow-sm shadow-brand-500/25 font-semibold'
                    : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium';
                return `
                    <button 
                        onclick="selectCategory('${cat}')" 
                        class="px-3.5 py-1.5 rounded-xl text-sm transition-all whitespace-nowrap cursor-pointer ${activeClasses}"
                    >
                        ${cat}
                    </button>
                `;
            }).join('');
        }

        function selectCategory(cat) {
            currentCategory = cat;
            renderCategoryTabs();
            renderNewsFeed();
        }

        // -------------------- 5. 渲染突发新闻滚动播报条 --------------------
        function renderBreakingTicker() {
            const track = document.getElementById('breaking-ticker-track');
            const breakingItems = newsArticles.filter(item => item.isBreaking);
            // 复制一份实现无缝首尾衔接循环滚动
            const loopItems = [...breakingItems, ...breakingItems];
            track.innerHTML = loopItems.map(item => `
                <button 
                    onclick="openArticleModal(${item.id})" 
                    class="inline-flex items-center gap-2 hover:text-amber-300 transition-colors cursor-pointer text-left"
                >
                    <span class="px-1.5 py-0.5 text-[10px] rounded bg-white/10 text-slate-300 font-medium">${item.category}</span>
                    <span class="truncate max-w-md sm:max-w-xl">${item.title}</span>
                    <span class="text-slate-600 mx-2">•</span>
                </button>
            `).join('');
        }

        // -------------------- 6. 渲染左侧主新闻信息流 --------------------
        function renderNewsFeed() {
            const heroContainer = document.getElementById('hero-news-container');
            const listContainer = document.getElementById('news-list-container');
            const emptyState = document.getElementById('empty-state');
            const titleEl = document.getElementById('feed-section-title');
            const countBadge = document.getElementById('news-count-badge');

            // 过滤数据
            const filtered = newsArticles.filter(article => {
                const matchCat = currentCategory === '全部' || article.category === currentCategory;
                const q = searchQuery.trim().toLowerCase();
                const matchSearch = !q || 
                    article.title.toLowerCase().includes(q) || 
                    article.summary.toLowerCase().includes(q) ||
                    article.category.toLowerCase().includes(q);
                return matchCat && matchSearch;
            });

            // 更新标题与数量徽章
            if (searchQuery.trim()) {
                titleEl.textContent = `“${searchQuery.trim()}” 的搜索结果`;
            } else {
                titleEl.textContent = currentCategory === '全部' ? '全部头条与深度报道' : `${currentCategory}频道 · 最新精选`;
            }
            countBadge.textContent = `${filtered.length} 篇`;

            // 处理空状态
            if (filtered.length === 0) {
                heroContainer.innerHTML = '';
                listContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            // 第一条作为头条大图卡片展示（当处于默认浏览或包含头条时）
            const heroArticle = filtered[0];
            const restArticles = filtered.slice(1);

            const heroBadgeClass = CATEGORY_BADGE_STYLES[heroArticle.category] || '';
            heroContainer.innerHTML = `
                <article 
                    onclick="openArticleModal(${heroArticle.id})" 
                    class="group relative bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 overflow-hidden shadow-sm hover:shadow-xl hover:border-brand-500/40 transition-all duration-300 cursor-pointer animate-slide-in"
                >
                    <div class="relative aspect-[16/9] sm:aspect-[21/10] overflow-hidden bg-slate-200 dark:bg-slate-800">
                        <img 
                            src="${heroArticle.image}" 
                            alt="${heroArticle.title}" 
                            onerror="this.src='https://placehold.co/1200x600/1e293b/94a3b8?text=PulseNews+Headline'"
                            class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                        >
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-950/40 to-transparent"></div>
                        
                        <!-- 左上角标签 -->
                        <div class="absolute top-4 left-4 flex items-center gap-2">
                            <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-red-600 text-white shadow">头条聚焦</span>
                            <span class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-black/50 backdrop-blur-md text-white border border-white/15">
                                ${heroArticle.category}
                            </span>
                            ${heroArticle.isNew ? '<span class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-emerald-500 text-white animate-pulse">NEW</span>' : ''}
                        </div>

                        <!-- 底部文字信息 -->
                        <div class="absolute bottom-0 inset-x-0 p-5 sm:p-7 text-white space-y-2.5">
                            <h3 class="text-xl sm:text-2xl lg:text-[26px] font-extrabold leading-snug group-hover:text-brand-300 transition-colors line-clamp-2">
                                ${highlightKeyword(heroArticle.title, searchQuery)}
                            </h3>
                            <p class="text-xs sm:text-sm text-slate-200/90 line-clamp-2 max-w-3xl">
                                ${highlightKeyword(heroArticle.summary, searchQuery)}
                            </p>
                            <div class="flex items-center gap-3 pt-1 text-xs text-slate-300">
                                <span class="font-medium text-white">${heroArticle.source}</span>
                                <span>·</span>
                                <span>${heroArticle.timeText}</span>
                                <span>·</span>
                                <span>${heroArticle.views}阅读</span>
                            </div>
                        </div>
                    </div>
                </article>
            `;

            // 渲染其余普通新闻列表卡片
            listContainer.innerHTML = restArticles.map(article => {
                const badgeClass = CATEGORY_BADGE_STYLES[article.category] || '';
                return `
                    <article 
                        onclick="openArticleModal(${article.id})" 
                        class="group bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 p-4 sm:p-5 flex flex-col sm:flex-row gap-4 sm:gap-5 shadow-sm hover:shadow-md hover:border-brand-500/40 transition-all duration-200 cursor-pointer animate-slide-in"
                    >
                        <!-- 左侧缩略图 -->
                        <div class="sm:w-48 md:w-56 aspect-video sm:aspect-[4/3] rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-800 shrink-0 relative">
                            <img 
                                src="${article.image}" 
                                alt="${article.title}" 
                                onerror="this.src='https://placehold.co/600x400/1e293b/94a3b8?text=PulseNews'"
                                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                            >
                            ${article.isNew ? '<span class="absolute top-2 left-2 px-2 py-0.5 rounded text-[10px] font-bold bg-red-600 text-white shadow">刚刚推送</span>' : ''}
                        </div>

                        <!-- 右侧文本内容 -->
                        <div class="flex-1 flex flex-col justify-between min-w-0">
                            <div class="space-y-2">
                                <div class="flex items-center gap-2">
                                    <span class="px-2 py-0.5 rounded-md text-xs font-semibold border ${badgeClass}">
                                        ${article.category}
                                    </span>
                                    <span class="text-xs text-slate-400 dark:text-slate-500">${article.timeText}</span>
                                </div>
                                <h3 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-snug group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors line-clamp-2">
                                    ${highlightKeyword(article.title, searchQuery)}
                                </h3>
                                <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 line-clamp-2 leading-relaxed">
                                    ${highlightKeyword(article.summary, searchQuery)}
                                </p>
                            </div>

                            <div class="flex items-center justify-between pt-3 mt-2 border-t border-slate-100 dark:border-slate-800/80 text-xs text-slate-400 dark:text-slate-500">
                                <span>${article.source}</span>
                                <span class="flex items-center gap-1 group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors">
                                    <span>${article.views}阅读</span>
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                                    </svg>
                                </span>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        // 搜索关键词高亮辅助函数
        function highlightKeyword(text, query) {
            if (!query || !query.trim()) return text;
            const escaped = query.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const regex = new RegExp(`(${escaped})`, 'gi');
            return text.replace(regex, '<mark class="bg-amber-200 dark:bg-amber-500/30 text-slate-900 dark:text-amber-200 px-0.5 rounded">$1</mark>');
        }

        // -------------------- 7. 渲染右侧 7×24小时实时快讯时间线 & 热门话题 --------------------
        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = timelineItems.map((item, idx) => `
                <div class="relative pl-5 border-l-2 ${idx === 0 ? 'border-red-500' : 'border-slate-200 dark:border-slate-700'} space-y-1 animate-slide-in">
                    <!-- 时间轴圆点 -->
                    <span class="absolute -left-[5px] top-1.5 w-2 h-2 rounded-full ${idx === 0 ? 'bg-red-500 ring-4 ring-red-500/20' : 'bg-slate-400 dark:bg-slate-500'}"></span>
                    
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-mono font-semibold ${idx === 0 ? 'text-red-600 dark:text-red-400' : 'text-brand-600 dark:text-brand-400'}">
                            ${item.time}
                        </span>
                        <span class="px-1.5 py-0.2 rounded text-[10px] font-medium bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">
                            ${item.category}
                        </span>
                    </div>
                    <p class="text-xs sm:text-sm leading-relaxed ${item.isHighlight ? 'font-semibold text-slate-900 dark:text-white' : 'text-slate-600 dark:text-slate-300'}">
                        ${item.text}
                    </p>
                </div>
            `).join('');
        }

        function renderTrendingTopics() {
            const container = document.getElementById('trending-topics-container');
            container.innerHTML = TRENDING_TOPICS.map(topic => {
                let rankStyle = 'text-slate-400 dark:text-slate-500 font-semibold';
                if (topic.rank === 1) rankStyle = 'text-red-600 font-black text-base';
                else if (topic.rank === 2) rankStyle = 'text-orange-500 font-black text-base';
                else if (topic.rank === 3) rankStyle = 'text-amber-500 font-black text-base';

                return `
                    <button 
                        onclick="searchTopic('${topic.title.slice(0, 4)}')" 
                        class="w-full py-2.5 px-1.5 flex items-center justify-between gap-3 hover:bg-slate-50 dark:hover:bg-slate-800/60 rounded-lg transition-colors text-left cursor-pointer group"
                    >
                        <div class="flex items-center gap-3 min-w-0">
                            <span class="w-5 text-center shrink-0 ${rankStyle}">${topic.rank}</span>
                            <span class="text-xs sm:text-sm font-medium text-slate-800 dark:text-slate-200 group-hover:text-brand-600 dark:group-hover:text-brand-400 truncate">
                                ${topic.title}
                            </span>
                            ${topic.tag ? `<span class="px-1.5 py-0.2 rounded text-[10px] font-bold shrink-0 ${topic.tagColor}">${topic.tag}</span>` : ''}
                        </div>
                        <span class="text-[11px] font-mono text-slate-400 shrink-0">${topic.heat}</span>
                    </button>
                `;
            }).join('');
        }

        // -------------------- 8. 实时动态推送核心机制（自动 + 手动） --------------------
        function getNextSimulatedArticle() {
            const template = LIVE_PUSH_POOL[pushPoolIndex % LIVE_PUSH_POOL.length];
            pushPoolIndex++;
            const nowStr = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            return {
                ...template,
                id: Date.now() + Math.floor(Math.random() * 1000),
                timeText: `刚刚 (${nowStr})`,
                views: `${(Math.random() * 8 + 1.2).toFixed(1)}万`,
                isHero: false,
                isBreaking: true,
                isNew: true
            };
        }

        // 自动定时推送：先放入待加载队列，并展示顶部红点提示横幅
        function autoPushNews() {
            const newArticle = getNextSimulatedArticle();
            pendingArticles.unshift(newArticle);

            // 同步更新右侧 7×24小时实时快讯时间线
            const nowTime = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            timelineItems.unshift({
                time: nowTime,
                category: newArticle.category,
                text: `【突发快讯】${newArticle.title}`,
                isHighlight: true
            });
            renderTimeline();

            // 显示“有 N 条新消息，点击刷新/加载”提示横幅
            const banner = document.getElementById('new-push-banner');
            const bannerText = document.getElementById('new-push-text');
            bannerText.textContent = `有 ${pendingArticles.length} 条最新实时快讯推送，点击立即加载查看`;
            banner.classList.remove('hidden');
        }

        // 用户点击提示横幅，将待加载新闻合并到主信息流顶部
        function loadPendingNews() {
            if (pendingArticles.length === 0) return;
            const count = pendingArticles.length;
            newsArticles = [...pendingArticles, ...newsArticles];
            pendingArticles = [];

            document.getElementById('new-push-banner').classList.add('hidden');
            renderBreakingTicker();
            renderNewsFeed();
            showToast(`已成功加载 ${count} 条最新实时新闻`);
        }

        // 用户手动点击“模拟接收最新快讯”按钮：立即生成并插入主信息流与时间线
        function triggerManualPush() {
            const newArticle = getNextSimulatedArticle();
            // 如果之前还有未加载的队列，一并合并进来
            newsArticles = [newArticle, ...pendingArticles, ...newsArticles];
            pendingArticles = [];
            document.getElementById('new-push-banner').classList.add('hidden');

            // 同步插入右侧时间线顶部
            const nowTime = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            timelineItems.unshift({
                time: nowTime,
                category: newArticle.category,
                text: `【实时直击】${newArticle.title}`,
                isHighlight: true
            });

            renderBreakingTicker();
            renderNewsFeed();
            renderTimeline();
            showToast(`已接收最新${newArticle.category}快讯！`);
        }

        // 每 18 秒自动触发一次后台新快讯推送提示
        setInterval(autoPushNews, 18000);

        // -------------------- 9. 搜索与筛选交互 --------------------
        const searchInput = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search-btn');

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            if (searchQuery.trim().length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            renderNewsFeed();
        });

        function clearSearch() {
            searchQuery = '';
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            renderNewsFeed();
        }

        function searchTopic(keyword) {
            currentCategory = '全部';
            searchQuery = keyword;
            searchInput.value = keyword;
            clearSearchBtn.classList.remove('hidden');
            renderCategoryTabs();
            renderNewsFeed();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetFilters(e) {
            if (e) e.preventDefault();
            currentCategory = '全部';
            clearSearch();
            renderCategoryTabs();
            renderNewsFeed();
        }

        // -------------------- 10. 新闻正文模态框控制 --------------------
        function openArticleModal(articleId) {
            const article = newsArticles.find(a => a.id === articleId);
            if (!article) return;

            currentModalArticle = article;
            document.getElementById('modal-category').textContent = article.category;
            document.getElementById('modal-source').textContent = `来源：${article.source}`;
            document.getElementById('modal-title').textContent = article.title;
            document.getElementById('modal-time').textContent = `发布时间：${article.timeText}`;
            document.getElementById('modal-views').textContent = `${article.views} 次阅读`;
            document.getElementById('modal-summary').textContent = `【核心摘要】${article.summary}`;

            const imgEl = document.getElementById('modal-image');
            imgEl.src = article.image;
            imgEl.onerror = function() {
                this.src = 'https://placehold.co/1200x600/1e293b/94a3b8?text=PulseNews+Detail';
            };

            const contentContainer = document.getElementById('modal-content');
            contentContainer.innerHTML = article.paragraphs.map(p => `<p>${p}</p>`).join('');

            document.getElementById('copy-btn-text').textContent = '分享摘要';
            document.getElementById('news-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('news-modal').classList.add('hidden');
            document.body.style.overflow = '';
            currentModalArticle = null;
        }

        // 按下 ESC 键关闭模态框
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !document.getElementById('news-modal').classList.contains('hidden')) {
                closeModal();
            }
        });

        // 复制新闻摘要到剪贴板（兼容 iFrame 环境）
        function copyArticleLink() {
            if (!currentModalArticle) return;
            const shareText = `【脉动资讯 · ${currentModalArticle.category}】${currentModalArticle.title}\n摘要：${currentModalArticle.summary}`;
            const textarea = document.createElement('textarea');
            textarea.value = shareText;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                document.getElementById('copy-btn-text').textContent = '已复制';
                showToast('新闻标题与摘要已复制到剪贴板');
            } catch (err) {
                showToast('复制失败，请手动选择文本复制');
            }
            document.body.removeChild(textarea);
        }

        // -------------------- 11. 轻提示 Toast --------------------
        let toastTimer = null;
        function showToast(msg) {
            const toast = document.getElementById('toast-notification');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.textContent = msg;
            toast.classList.remove('hidden');

            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // -------------------- 12. 页面初始化渲染 --------------------
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            renderCategoryTabs();
            renderBreakingTicker();
            renderNewsFeed();
            renderTimeline();
            renderTrendingTopics();
        });
    </script>
</body>
</html>
